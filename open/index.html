<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cave Player — открыть трек</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #12162a; color: #ede9e1;
         font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 440px; padding: 32px 24px; text-align: center; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: #9399b8; margin: 8px 0; }
  a.btn { display: inline-block; margin-top: 16px; padding: 12px 22px; border-radius: 999px; background: #f2c14e; color: #241c06;
          text-decoration: none; font-weight: 600; }
  small { color: #626a8f; }
</style>
</head>
<body>
<main>
  <h1>Открываем в Cave Player…</h1>
  <p id="msg">Если ничего не произошло, нажмите кнопку ниже.</p>
  <a class="btn" id="open" href="#">Открыть в Cave Player</a>
  <p><small>Cave Player должен быть установлен на этом компьютере (Windows).</small></p>
</main>
<script>
  // Адрес вида …/open/?t=<id трека> превращаем в caveplayer://track/<id>
  var id = new URLSearchParams(location.search).get('t') || '';
  var ok = /^[A-Za-z0-9_-]+$/.test(id);
  var link = ok ? 'caveplayer://track/' + id : '';
  var btn = document.getElementById('open');
  if (ok) {
    btn.href = link;
    location.href = link;
  } else {
    document.getElementById('msg').textContent = 'В этой ссылке не нашёлся трек.';
    btn.style.display = 'none';
  }
</script>
</body>
</html>
